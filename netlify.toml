# Netlify: no build step needed; the built site is committed in docs/.
# (If you prefer Netlify to build, set command = "python3 build.py".)
[build]
  publish = "docs"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
